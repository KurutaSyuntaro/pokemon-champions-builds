name: Build site

on:
  push:
    branches: [main]
    paths:
      - "teams/*.md"
      - "build.py"
      - "data/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build HTML
        run: python build.py

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html "teams/*.html"
          git diff --cached --quiet && echo "変更なし" || (git commit -m "Auto-build: HTMLを生成" && git push)
